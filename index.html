<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>我的简单网页</title>
    <style>
        /* 简单css样式 */
        body {
            font-family: "Microsoft Yahei", sans-serif;
            background-color: #f0f4f8;
            text-align: center;
            padding-top: 80px;
        }
        .box {
            background: white;
            width: 400px;
            margin: 0 auto;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 2px 10px #ccc;
        }
        h1 {
            color: #2c3e50;
        }
        p {
            color: #666;
        }
        button {
            padding: 8px 20px;
            background: #3498db;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="box">
        <h1>Hello HTML</h1>
        <p>这是一个简单的静态网页</p>
        <button onclick="alert('你点击了按钮！')">点我试试</button>
    </div>
</body>
</html>
